name: CI

# Integración continua: pruebas, build y análisis de seguridad.
# No usa credenciales AWS ni secretos, no publica imágenes y no despliega nada.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + PostgreSQL 18)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Las pruebas se conectan con las variables estándar de libpq; contraseña solo de CI.
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-production.lock
      - name: Instalar dependencias fijadas
        run: python -m pip install -r backend/requirements-production.lock pytest==9.0.2 httpx==0.28.1
      - name: Preparar roles y base de pruebas
        run: |
          psql -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE nexoeventos_owner NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;
          CREATE ROLE nexoeventos_app LOGIN PASSWORD 'ci-only-not-a-secret' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;
          CREATE DATABASE nexoeventos_test OWNER nexoeventos_owner;
          REVOKE ALL ON DATABASE nexoeventos_test FROM PUBLIC;
          GRANT CONNECT ON DATABASE nexoeventos_test TO nexoeventos_app;
          SQL
      - name: Migrar y probar
        working-directory: backend
        env:
          MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:ci-only-not-a-secret@localhost:5432/nexoeventos_test
        run: |
          alembic upgrade head
          pytest -q

  respaldo-script:
    name: Respaldo periódico cifrado (pruebas locales, sin nube)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Probar backup_cycle.py y backup_freshness.py (servidor HTTP falso en 127.0.0.1, claves desechables)
        run: python scripts/multicloud/test_backup_cycle.py
      - name: Probar el descifrado de respaldos con claves protegidas por contraseña (claves desechables, sin base de datos real)
        run: python scripts/multicloud/test_cms_key_passin.py
      - name: Probar el selector de respaldo restaurable del failover con el orquestador simulado (respaldos cifrados reales, PostgreSQL falso)
        run: |
          python -m pip install -r backend/requirements-production.lock
          python -m unittest discover -s scripts/multicloud/tests -p test_backup_source.py
          python -m unittest discover -s scripts/multicloud/tests -p test_oci_source.py
          python -m unittest discover -s scripts/multicloud/tests -p test_lease_http.py
          python -m unittest discover -s scripts/multicloud/tests -p test_failover_e2e.py

  frontend:
    name: Frontend (pruebas + build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar, probar y compilar
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

  docker:
    name: Imagen Docker + Trivy (imagen)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Construir la imagen (sin publicar)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: false
          load: true
          tags: nexoeventos-backend:ci
      - name: Comprobar usuario no root y arranque saludable
        run: |
          test "$(docker run --rm --entrypoint id nexoeventos-backend:ci -u)" != "0"
          docker run -d --name api -p 127.0.0.1:8000:8000 \
            -e APP_ENV=development \
            -e DATABASE_URL=postgresql+psycopg://nobody@127.0.0.1:1/none \
            -e TICKET_ENCRYPTION_KEY="$(openssl rand -base64 32 | tr '+/' '-_')" \
            nexoeventos-backend:ci
          for _ in $(seq 1 30); do
            state="$(docker inspect --format '{{.State.Health.Status}}' api)"
            [ "$state" = "healthy" ] && break
            sleep 2
          done
          echo "Estado de salud: $state"
          curl --fail --silent http://127.0.0.1:8000/health
          [ "$state" = "healthy" ] || { docker logs api; exit 1; }
      - name: Trivy sobre la imagen (HIGH y CRITICAL con corrección disponible bloquean)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          image-ref: nexoeventos-backend:ci
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
          format: table
          output: trivy-image.txt
      - name: Mostrar resultados de la imagen
        if: always()
        run: |
          { echo '### Trivy · imagen del backend'; echo '```'; cat trivy-image.txt 2>/dev/null || echo 'Sin salida (el análisis no llegó a ejecutarse).'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat trivy-image.txt 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: trivy-imagen
          path: trivy-image.txt
          if-no-files-found: ignore

  trivy-repo:
    name: Trivy (dependencias, secretos y configuración)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependencias y secretos (bloquea HIGH/CRITICAL con corrección y cualquier secreto)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
          format: table
          output: trivy-repo.txt
      # Trivy solo reconoce `requirements.txt`; el archivo que llega a producción es `requirements-production.lock` (con las transitivas).
      # Se copia con ese nombre a un directorio aparte para analizar exactamente lo que se instala en producción.
      - name: Preparar el lockfile de producción para Trivy
        run: |
          mkdir -p "$RUNNER_TEMP/lock-prod"
          cp backend/requirements-production.lock "$RUNNER_TEMP/lock-prod/requirements.txt"
      - name: Lockfile de producción (bloquea HIGH/CRITICAL con corrección)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          scan-type: fs
          scan-ref: ${{ runner.temp }}/lock-prod
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
          format: table
          output: trivy-lock.txt
      - name: "Configuración (Dockerfile, Compose, Terraform), informe sin bloquear"
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table
          output: trivy-config.txt
      - name: Mostrar resultados
        if: always()
        run: |
          {
            echo '### Trivy · dependencias y secretos'; echo '```'; cat trivy-repo.txt 2>/dev/null || echo 'Sin salida.'; echo '```'
            echo '### Trivy · lockfile de producción'; echo '```'; cat trivy-lock.txt 2>/dev/null || echo 'Sin salida.'; echo '```'
            echo '### Trivy · configuración (informativo)'; echo '```'; cat trivy-config.txt 2>/dev/null || echo 'Sin salida.'; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat trivy-repo.txt trivy-lock.txt trivy-config.txt 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: trivy-repositorio
          path: |
            trivy-repo.txt
            trivy-lock.txt
            trivy-config.txt
          if-no-files-found: ignore
