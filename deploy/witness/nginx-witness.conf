# Fragmento para el server{} HTTPS existente de la VM (junto a /grafana/, /zabbix/ y /ops/). NO aplicado todavía.
# Requiere que el NSG permita 443 a los informantes (AWS en T5, OCI en T6) como reglas /32 TEMPORALES y específicas (autorización aparte); hasta entonces solo la IP del operador.
location = /witness { return 301 /witness/; }
location /witness/ {
    limit_except GET POST { deny all; }
    proxy_pass         http://127.0.0.1:8760/;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Forwarded-Proto https;
    proxy_set_header   Authorization $http_authorization;
    proxy_read_timeout 10s;
    client_max_body_size 16k;
}
