# Fragmento para el server{} HTTPS EXISTENTE de la VM (junto a /grafana/, /zabbix/ y /ops/). NO aplicado todavía.
# No abre puertos nuevos: reutiliza 443 y la regla /32 del NSG. TLS y HSTS los pone el server{} existente.
location = /nexoops { return 301 /nexoops/; }
location /nexoops/ {
    proxy_pass         http://127.0.0.1:8770/;      # la barra final quita el prefijo; la app conoce su subruta por NEXOOPS_BASE_PATH
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Forwarded-Proto https;
    proxy_set_header   X-Forwarded-For $remote_addr;
    proxy_read_timeout 20s;
    client_max_body_size 16k;
    limit_except GET HEAD POST { deny all; }
    # Un add_header propio anula la herencia del server{}: así no se duplican X-Frame-Options/Referrer-Policy (la app ya envía las más estrictas) y se conserva HSTS.
    add_header Strict-Transport-Security "max-age=31536000" always;
}
