# Fragmento para el server{} HTTPS existente de la VM (dentro de el, junto a /grafana/ y /zabbix/). NO aplicado todavia.
# El 443 y la IP /32 ya estan permitidos en el NSG: no se abre ningun puerto nuevo.
location = /ops { return 301 /ops/; }
location /ops/ {
    proxy_pass         http://127.0.0.1:8750/;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Forwarded-Proto https;
    proxy_set_header   Authorization $http_authorization;
    proxy_read_timeout 15s;
    client_max_body_size 16k;
}
