[defaults]
# Los wrappers generan work/ansible/inventory.yml (0600) después de comprobar
# cuenta, región, etiqueta y unicidad. El plugin dinámico queda como referencia.
roles_path = roles
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
stdout_callback = default
timeout = 30

[connection]
pipelining = True
