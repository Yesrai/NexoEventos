---
- name: Verificar recorrido del servicio recuperado
  hosts: nexoeventos_recovery
  gather_facts: false
  become: true
  vars_files:
    - "{{ runtime_vars_file | default('../../work/recovery/runtime.yml') }}"
  vars:
    ansible_aws_ssm_bucket_name: "{{ ssm_bucket_name }}"
    ansible_aws_ssm_profile: "{{ aws_profile }}"
  pre_tasks:
    - name: Limitar verificación al entorno temporal
      ansible.builtin.assert:
        that:
          - inventory_hostname is match('^nexoeventos-academy-recovery-[0-9]{8}t[0-9]{4}-app$')
          - nexoeventos_domain is match('^nexoeventos-recovery-[0-9-]+\\.sslip\\.io$')
  tasks:
    - name: Ejecutar flujo con credencial efímera y limpieza garantizada
      block:
        - name: Preparar operador exclusivo del ensayo sin cambiar propietarios
          ansible.builtin.shell:
            cmd: |
              set -euo pipefail
              set -a
              . /etc/nexoeventos/backend.env
              . /etc/nexoeventos/migration.env
              set +a
              password="$(/opt/nexoeventos/backend/.venv/bin/python -c 'import secrets; print("Recovery-" + secrets.token_urlsafe(24))')"
              NEXO_ALLOW_DEPLOYED_DEMO=YES APP_ENV=production \
              NEXO_DEV_OPERATOR_PASSWORD="$password" \
                /opt/nexoeventos/backend/.venv/bin/python /opt/nexoeventos/scripts/dev-bootstrap.py \
                --deployed-demo --operator-only --operator-email operador.recuperacion@example.com \
                --operator-event 1001 --database-url "$MIGRATION_DATABASE_URL"
              install -o root -g root -m 0600 /dev/null /etc/nexoeventos/recovery-demo.env
              printf 'NEXO_DEMO_OPERATOR_EMAIL=%s\nNEXO_DEV_OPERATOR_PASSWORD=%s\n' \
                'operador.recuperacion@example.com' "$password" > /etc/nexoeventos/recovery-demo.env
              unset password
            executable: /bin/bash
          no_log: true

        - name: Ejecutar recorrido HTTPS completo sin imprimir QR ni cookies
          ansible.builtin.shell:
            cmd: |
              set -euo pipefail
              set -a
              . /etc/nexoeventos/recovery-demo.env
              set +a
              NEXO_PUBLIC_URL="https://{{ nexoeventos_domain }}" \
                /opt/nexoeventos-deploy/current/backend/.venv/bin/python \
                /opt/nexoeventos-deploy/current/scripts/cloud/verify-public-flow.py
            executable: /bin/bash
          register: recovery_public_flow
          changed_when: false
      always:
        - name: Eliminar credencial del operador tras la prueba
          ansible.builtin.file:
            path: /etc/nexoeventos/recovery-demo.env
            state: absent
          no_log: true

    - name: Resumir verificaciones seguras
      ansible.builtin.debug:
        msg:
          flow: "{{ recovery_public_flow.stdout_lines }}"
