---
- name: Desplegar NexoEventos en el entorno temporal de recuperación
  hosts: nexoeventos_recovery
  gather_facts: false
  become: true
  vars_files:
    - "{{ runtime_vars_file | default('../../work/recovery/runtime.yml') }}"
  vars:
    ansible_aws_ssm_bucket_name: "{{ ssm_bucket_name }}"
    ansible_aws_ssm_profile: "{{ aws_profile }}"
    nexoeventos_run_migrations: false
  pre_tasks:
    - name: Exigir destino temporal y no ejecutar migraciones
      ansible.builtin.assert:
        that:
          - inventory_hostname is match('^nexoeventos-academy-recovery-[0-9]{8}t[0-9]{4}-app$')
          - nexoeventos_domain is match('^nexoeventos-recovery-[0-9-]+\\.sslip\\.io$')
          - nexoeventos_domain != 'nexoeventos-demo.duckdns.org'
          - not nexoeventos_run_migrations
  roles:
    - nexoeventos
