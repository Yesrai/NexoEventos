---
- name: Desplegar una versión verificable de NexoEventos
  hosts: nexoeventos_app
  # La recopilación completa dispara un fallo del worker de Ansible en este Mac
  # mediante SSM. El rol comprueba de forma explícita solo la plataforma usada.
  gather_facts: false
  become: true
  vars_files:
    - "{{ runtime_vars_file | default('../../work/ansible/runtime.yml') }}"
  vars:
    ansible_aws_ssm_bucket_name: "{{ ssm_bucket_name }}"
    ansible_aws_ssm_profile: "{{ aws_profile }}"
  roles:
    - nexoeventos
