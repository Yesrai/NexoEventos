---
- name: Verificar datos y claves del servicio restaurado
  hosts: nexoeventos_recovery
  gather_facts: false
  become: true
  vars_files:
    - "{{ runtime_vars_file | default('../../work/recovery/runtime.yml') }}"
  vars:
    ansible_aws_ssm_bucket_name: "{{ ssm_bucket_name }}"
    ansible_aws_ssm_profile: "{{ aws_profile }}"
  pre_tasks:
    - name: Limitar verificación al entorno temporal
      ansible.builtin.assert:
        that:
          - inventory_hostname is match('^nexoeventos-academy-recovery-[0-9]{8}t[0-9]{4}-app$')
          - nexoeventos_domain is match('^nexoeventos-recovery-[0-9-]+\\.sslip\\.io$')
  tasks:
    - name: Verificar revisión, reservas y descifrado de entradas restauradas
      ansible.builtin.command:
        argv:
          - /opt/nexoeventos/deploy/verify-restore.sh
          - service
          - '135'
      register: recovery_data_verification
      changed_when: false

    - name: Mostrar únicamente el resumen sanitizado
      ansible.builtin.debug:
        var: recovery_data_verification.stdout_lines
