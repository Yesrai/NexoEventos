---
- name: Hornear la AMI de NexoEventos V2 (instancia temporal; sin secretos, sin migraciones, API sin arrancar)
  hosts: nexoeventos_app
  gather_facts: false
  become: true
  vars_files:
    - "{{ runtime_vars_file | default('../../work/ansible/runtime.yml') }}"
  vars:
    ansible_aws_ssm_bucket_name: "{{ ssm_bucket_name }}"
    ansible_aws_ssm_profile: "{{ aws_profile }}"
    nexoeventos_bake: true
    nexoeventos_edge: alb
    nexoeventos_run_migrations: false
  roles:
    - nexoeventos
  post_tasks:
    - name: Comprobar que la imagen NO contiene secretos, certificados ni tokens
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/nexoeventos/backend.env
        - /etc/nexoeventos/migration.env
        - /etc/nexoeventos/duckdns.env
        - /etc/letsencrypt
      register: leftovers
    - name: Abortar si existe alguno
      ansible.builtin.assert:
        that: leftovers.results | map(attribute='stat.exists') | select | list | length == 0
        fail_msg: La instancia temporal contiene secretos o certificados; no se debe crear la AMI.
    - name: Limpiar registros y estado de cloud-init para que cada instancia nueva arranque limpia
      ansible.builtin.shell: |
        rm -rf /var/lib/nexoeventos/tmp/* /root/.bash_history /home/ec2-user/.bash_history /var/log/nexoeventos/* 2>/dev/null || true
        cloud-init clean --logs
      changed_when: true
