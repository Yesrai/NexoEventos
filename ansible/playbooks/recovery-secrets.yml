---
- name: Preparar identidades y secretos del entorno temporal
  hosts: nexoeventos_recovery
  gather_facts: false
  become: true
  vars_files:
    - "{{ runtime_vars_file | default('../../work/recovery/runtime.yml') }}"
  vars:
    ansible_aws_ssm_bucket_name: "{{ ssm_bucket_name }}"
    ansible_aws_ssm_profile: "{{ aws_profile }}"
  pre_tasks:
    - name: Validar alcance y respaldo local sin leerlo
      ansible.builtin.assert:
        that:
          - inventory_hostname is match('^nexoeventos-academy-recovery-[0-9]{8}t[0-9]{4}-app$')
          - recovery_db_identifier == 'nexoeventos-academy-recovery-' + recovery_run_id + '-postgres'
          - recovery_keys_file is file
          - nexoeventos_domain is match('^nexoeventos-recovery-[0-9-]+\\.sslip\\.io$')
  tasks:
    - name: Instalar secretos recuperados y contraseñas DB aisladas
      block:
        - name: Transferir respaldo de claves a memoria temporal protegida
          ansible.builtin.copy:
            src: "{{ recovery_keys_file }}"
            dest: /run/nexoeventos-recovery-keys.env
            owner: root
            group: root
            mode: '0600'
          no_log: true

        - name: Aprovisionar roles y archivos protegidos sin entrada interactiva
          ansible.builtin.command:
            argv:
              - /opt/nexoeventos/deploy/bootstrap-rds-secrets.sh
              - "{{ recovery_db_identifier }}"
              - us-east-1
              - "{{ nexoeventos_domain }}"
          environment:
            NEXO_GENERATE_DATABASE_PASSWORDS: 'YES'
            NEXO_RECOVERY_KEYS_FILE: /run/nexoeventos-recovery-keys.env
            NEXO_DB_ENDPOINT: "{{ recovery_db_endpoint }}"
            NEXO_MASTER_SECRET_ARN: "{{ source_master_secret_arn }}"
          no_log: true
      always:
        - name: Eliminar copia temporal de claves del servidor
          ansible.builtin.file:
            path: /run/nexoeventos-recovery-keys.env
            state: absent
          no_log: true

    - name: Comprobar archivos finales sin leer valores
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/nexoeventos/backend.env
        - /etc/nexoeventos/migration.env
      register: recovery_secret_files
      no_log: true

    - name: Exigir archivos root 0600 y sin configuración DuckDNS
      ansible.builtin.assert:
        that:
          - recovery_secret_files.results | map(attribute='stat.exists') | min
          - recovery_secret_files.results | map(attribute='stat.mode') | unique == ['0600']
          - recovery_secret_files.results | map(attribute='stat.pw_name') | unique == ['root']

