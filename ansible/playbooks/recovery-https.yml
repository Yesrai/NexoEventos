---
- name: Configurar HTTPS del entorno temporal de recuperación
  hosts: nexoeventos_recovery
  gather_facts: false
  become: true
  vars_files:
    - "{{ runtime_vars_file | default('../../work/recovery/runtime.yml') }}"
  vars:
    ansible_aws_ssm_bucket_name: "{{ ssm_bucket_name }}"
    ansible_aws_ssm_profile: "{{ aws_profile }}"
  pre_tasks:
    - name: Exigir hostname temporal y excluir el dominio principal
      ansible.builtin.assert:
        that:
          - inventory_hostname is match('^nexoeventos-academy-recovery-[0-9]{8}t[0-9]{4}-app$')
          - nexoeventos_domain is match('^nexoeventos-recovery-[0-9-]+\\.sslip\\.io$')
          - nexoeventos_domain != 'nexoeventos-demo.duckdns.org'
  tasks:
    - name: Obtener certificado individual mediante HTTP-01
      ansible.builtin.command:
        argv:
          - /opt/nexoeventos/deploy/configure-https.sh
          - "{{ nexoeventos_domain }}"
      environment:
        NEXO_CERTBOT_NONINTERACTIVE: 'YES'
      register: recovery_https
      changed_when: "'HTTPS configurado' in recovery_https.stdout"

    - name: Confirmar certificado sin publicar identificadores sensibles
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "/etc/letsencrypt/live/{{ nexoeventos_domain }}/fullchain.pem"
          - -noout
          - -issuer
          - -enddate
      register: recovery_certificate
      changed_when: false

    - name: Mostrar emisor y vencimiento
      ansible.builtin.debug:
        var: recovery_certificate.stdout_lines
