---
- name: Versiones instaladas (evidencia; sin secretos)
  ansible.builtin.shell: |
    set -o pipefail
    for p in zabbix-server-pgsql zabbix-frontend-php zabbix-agent2 grafana postgresql nginx; do dpkg-query -W -f='${Package} ${Version}\n' "$p" 2>/dev/null; done
    sha256sum /root/zabbix-release.deb
  args: { executable: /bin/bash }
  register: _versions
  changed_when: false

- name: Guardar las versiones en la estación de control
  ansible.builtin.copy:
    content: "{{ _versions.stdout }}\n"
    dest: "{{ monitoring_secrets_dir }}/../versiones-instaladas-{{ inventory_hostname }}.txt"
    mode: "0644"
  delegate_to: localhost
  become: false
