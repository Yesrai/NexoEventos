---
- name: Paquetes base
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg, openssl, unattended-upgrades, acl]
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 300
    state: present

- name: Actualizaciones de seguridad automáticas
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"

- name: Endurecimiento del invitado (swap, sysctl, SSH, UFW)
  when: monitoring_host_hardening | bool
  block:
    - name: Archivo de swap
      ansible.builtin.command:
        cmd: "sh -c 'fallocate -l {{ monitoring_swap_mb }}M /swapfile && chmod 600 /swapfile && mkswap /swapfile'"
        creates: /swapfile
    - name: Montar swap
      ansible.builtin.lineinfile: { path: /etc/fstab, line: "/swapfile none swap sw 0 0", regexp: '^/swapfile\s', state: present }
    - name: Activar swap
      ansible.builtin.command: swapon -a
      changed_when: false
    - name: Parámetros sysctl (poca presión sobre el disco)
      ansible.builtin.copy:
        dest: /etc/sysctl.d/90-nexo-obs.conf
        content: |
          vm.swappiness=10
          net.ipv4.conf.all.rp_filter=1
          net.ipv4.tcp_syncookies=1
        mode: "0644"
      notify: Aplicar sysctl
    - name: SSH solo con clave, sin root
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/99-nexo-obs.conf
        content: |
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin no
          X11Forwarding no
          MaxAuthTries 3
          AllowUsers {{ ansible_user | default('nexoadmin') }}
        mode: "0644"
    - name: Validar la configuración de SSH antes de recargarla
      ansible.builtin.command: sshd -t
      changed_when: false
      notify: Reiniciar SSH
    - name: UFW instalado
      ansible.builtin.apt: { name: ufw, state: present, lock_timeout: 300 }
    - name: UFW — SSH y HTTPS solo desde la IP del operador (antes de activar; idempotente)
      ansible.builtin.command: "ufw allow from {{ monitoring_admin_cidr }} to any port {{ item }} proto tcp"
      loop: ["22", "443"]
      changed_when: false
    - name: UFW — entrada denegada por defecto y salida permitida (el NSG de Azure restringe la salida)
      ansible.builtin.command: "ufw default {{ item }}"
      loop: ["deny incoming", "allow outgoing"]
      changed_when: false
    - name: UFW activo
      ansible.builtin.command: ufw --force enable
      changed_when: false
