zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 55da4a5c1f104eca8d864f24ac72730b
      name: Templates/NexoEventos
  templates:
    - uuid: 526a6b9caff74eb4abeb3322c3ce40c7
      template: 'NexoEventos Historical Metrics'
      name: 'NexoEventos Historical Metrics (datos históricos reales importados)'
      description: |
        Series reales de AWS (CloudWatch) y OCI (Monitoring) y de las pruebas de carga, obtenidas de solo lectura en las ventanas en que los recursos estuvieron encendidos
        e importadas a Zabbix con su marca de tiempo original (history.push). NO son monitoreo en vivo: los paneles lo indican y la fecha de cada serie es la real.
      groups:
        - name: Templates/NexoEventos
      items:
        - uuid: 16e8f1fcb4bd435a8317f91bd29d2ba0
          name: '[hist] CPU de la instancia (%)'
          type: TRAP
          key: nexo.hist.cpu_pct
          delay: '0'
          history: 365d
          trends: 365d
          value_type: FLOAT
          units: '%'
          description: 'Datos históricos reales de CloudWatch / OCI Monitoring importados con su marca de tiempo original.'
          tags:
            - tag: source
              value: historical
        - uuid: 2a39f868e1b64401bc514f158e4671a5
          name: '[hist] Memoria utilizada (%)'
          type: TRAP
          key: nexo.hist.mem_pct
          delay: '0'
          history: 365d
          trends: 365d
          value_type: FLOAT
          units: '%'
          description: 'OCI Monitoring (agente de cómputo) o métrica equivalente; vacío en AWS si no se publicó.'
          tags:
            - tag: source
              value: historical
        - uuid: 1b608eac89844d6eafc8f2f20239c370
          name: '[hist] Red entrante (bytes)'
          type: TRAP
          key: nexo.hist.net_in_bytes
          delay: '0'
          history: 365d
          trends: 365d
          value_type: FLOAT
          units: 'B'
          description: ''
          tags:
            - tag: source
              value: historical
        - uuid: ec276afe764242939c9583eb6d720d8d
