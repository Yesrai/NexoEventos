---
- name: Reiniciar API
  when: not nexoeventos_bake
  ansible.builtin.systemd_service:
    name: nexoeventos-api
    state: restarted
    enabled: true
    daemon_reload: true

- name: Recargar Nginx
  when: not nexoeventos_bake
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded
    enabled: true
