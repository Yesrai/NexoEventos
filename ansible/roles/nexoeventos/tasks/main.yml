---
- name: Comprobar Amazon Linux 2023 sin recopilar facts completos
  ansible.builtin.shell:
    cmd: >-
      grep -Eq '^ID="?amzn"?$' /etc/os-release &&
      grep -Eq '^VERSION_ID="?2023"?$' /etc/os-release
    executable: /bin/bash
  register: platform_check
  changed_when: false
  failed_when: false

- name: Validar parámetros y plataforma
  ansible.builtin.assert:
    that:
      - platform_check.rc == 0
      - release_id is match('^[0-9a-f]{7,40}$')
      - release_artifact is file
      - nexoeventos_domain == 'nexoeventos-demo.duckdns.org'
    fail_msg: Plataforma, dominio o artefacto no válidos; no se modificó la aplicación.

- name: Comprobar secretos y certificado existentes sin leer su contenido
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /etc/nexoeventos/backend.env
    - /etc/nexoeventos/migration.env
    - "/etc/letsencrypt/live/{{ nexoeventos_domain }}/fullchain.pem"
    - "/etc/letsencrypt/live/{{ nexoeventos_domain }}/privkey.pem"
  register: protected_files
  no_log: true

- name: Exigir secretos y TLS antes de actualizar
  ansible.builtin.assert:
    that:
      - protected_files.results | map(attribute='stat.exists') | min
    fail_msg: Faltan secretos o certificado existentes; despliegue cancelado sin regenerarlos.

- name: Mantener paquetes base de Amazon Linux 2023
  ansible.builtin.dnf:
    name:
      - nginx
      - python3.11
      - python3.11-pip
    state: present

- name: Preparar directorios de versiones
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ nexoeventos_release_root }}", group: root, mode: '0755' }
    - { path: "{{ nexoeventos_release_root }}/releases", group: root, mode: '0755' }
    - { path: /var/log/nexoeventos, group: nexoeventos, mode: '0750' }

- name: Crear directorio de la nueva versión
  ansible.builtin.file:
    path: "{{ nexoeventos_release_root }}/releases/{{ release_id }}"
    state: directory
    owner: root
    group: nexoeventos
    # Nginx necesita atravesar este directorio para servir frontend/dist. El
    # backend y los secretos conservan permisos más restrictivos debajo.
    mode: '0755'

- name: Extraer el artefacto versionado
  ansible.builtin.unarchive:
    src: "{{ release_artifact }}"
    dest: "{{ nexoeventos_release_root }}/releases/{{ release_id }}"
    owner: root
    group: nexoeventos
    mode: u=rwX,g=rX,o=

- name: Permitir a Nginx recorrer los directorios públicos del frontend
  ansible.builtin.command:
    argv:
      - find
      - "{{ nexoeventos_release_root }}/releases/{{ release_id }}/frontend/dist"
      - -type
      - d
      - -exec
      - chmod
      - '0755'
      - '{}'
      - +
  changed_when: true

- name: Permitir a Nginx leer los archivos públicos del frontend
  ansible.builtin.command:
    argv:
      - find
      - "{{ nexoeventos_release_root }}/releases/{{ release_id }}/frontend/dist"
      - -type
      - f
      - -exec
      - chmod
      - '0644'
      - '{}'
      - +
  changed_when: true

- name: Crear entorno virtual aislado de la versión
  ansible.builtin.command:
    cmd: >-
      python3.11 -m venv
      {{ nexoeventos_release_root }}/releases/{{ release_id }}/backend/.venv
    creates: "{{ nexoeventos_release_root }}/releases/{{ release_id }}/backend/.venv/bin/python"

- name: Instalar dependencias Python fijadas
  ansible.builtin.command:
    cmd: >-
      {{ nexoeventos_release_root }}/releases/{{ release_id }}/backend/.venv/bin/python
      -m pip install --disable-pip-version-check
      --requirement {{ nexoeventos_release_root }}/releases/{{ release_id }}/backend/requirements-production.lock
  register: pip_install
  changed_when: "'Successfully installed' in pip_install.stdout"

- name: Exigir la ruta del recibo antes de inspeccionarlo
  ansible.builtin.assert:
    that:
      - migration_backup_receipt is defined
      - migration_backup_receipt is string
      - migration_backup_receipt is match('^/var/lib/nexoeventos/backups/[A-Za-z0-9._-]+\\.receipt$')
    fail_msg: Falta la ruta válida del recibo remoto del respaldo; no se ejecutaron migraciones.
  when: nexoeventos_run_migrations

- name: Verificar recibo del respaldo previo a migraciones
  ansible.builtin.stat:
    path: "{{ migration_backup_receipt }}"
  register: migration_receipt
  when: nexoeventos_run_migrations

- name: Exigir respaldo identificado y entorno de migración protegido
  ansible.builtin.assert:
    that:
      - migration_receipt.stat.isreg | default(false)
      - migration_receipt.stat.mode == '0600'
      - protected_files.results[1].stat.mode == '0600'
    fail_msg: No existe un recibo 0600 de respaldo previo; no se ejecutaron migraciones.
  when: nexoeventos_run_migrations

- name: Migrar de forma controlada antes de publicar la revisión
  when: nexoeventos_run_migrations
  block:
    - name: Pausar API durante la migración y la siembra
      ansible.builtin.systemd_service:
        name: nexoeventos-api
        state: stopped

    - name: Aplicar migraciones hasta head con la identidad separada
      ansible.builtin.shell:
        cmd: |
          set -a
          . /etc/nexoeventos/migration.env
          set +a
          .venv/bin/alembic upgrade head
        chdir: "{{ nexoeventos_release_root }}/releases/{{ release_id }}/backend"
        executable: /bin/bash
      no_log: true

    - name: Sembrar catálogo ficticio sin eliminar reservas existentes
      ansible.builtin.shell:
        cmd: |
          set -a
          . /etc/nexoeventos/migration.env
          set +a
          ../backend/.venv/bin/python seed-demo-catalog.py --database-url "$MIGRATION_DATABASE_URL"
        chdir: "{{ nexoeventos_release_root }}/releases/{{ release_id }}/scripts"
        executable: /bin/bash
      no_log: true

    - name: Confirmar revisión 0005
      ansible.builtin.shell:
        cmd: |
          set -a
          . /etc/nexoeventos/migration.env
          set +a
          .venv/bin/alembic current
        chdir: "{{ nexoeventos_release_root }}/releases/{{ release_id }}/backend"
        executable: /bin/bash
      register: migration_current
      changed_when: false
      no_log: true

    - name: Exigir head esperado antes del cambio de versión
      ansible.builtin.assert:
        that: "'0005' in migration_current.stdout"
        fail_msg: La base no llegó a la revisión 0005; no se publicó la aplicación.
  rescue:
    - name: Reiniciar la aplicación anterior tras un fallo transaccional
      ansible.builtin.systemd_service:
        name: nexoeventos-api
        state: restarted
    - name: Cancelar publicación
      ansible.builtin.fail:
        msg: Migración o siembra fallida; se mantuvo la versión anterior. Revisar respaldo antes de reintentar.

- name: Inspeccionar enlace current sin seguirlo
  ansible.builtin.stat:
    path: "{{ nexoeventos_release_root }}/current"
    follow: false
  register: current_link

- name: Detectar la instalación inicial anterior a Ansible
  ansible.builtin.stat:
    path: /opt/nexoeventos/backend/.venv/bin/uvicorn
  register: legacy_release

- name: Definir el destino seguro de reversión
  ansible.builtin.set_fact:
    rollback_release: >-
      {{ current_link.stat.lnk_source
         if (current_link.stat.islnk | default(false))
         else ('/opt/nexoeventos' if legacy_release.stat.exists else '') }}

- name: Conservar la versión actual como previous
  ansible.builtin.file:
    src: "{{ rollback_release }}"
    dest: "{{ nexoeventos_release_root }}/previous"
    state: link
    force: true
  when: rollback_release | length > 0

- name: Publicar la nueva versión mediante enlace atómico
  ansible.builtin.file:
    src: "{{ nexoeventos_release_root }}/releases/{{ release_id }}"
    dest: "{{ nexoeventos_release_root }}/current"
    state: link
    force: true

- name: Instalar unidad systemd versionada
  ansible.builtin.template:
    src: nexoeventos-api.service.j2
    dest: /etc/systemd/system/nexoeventos-api.service
    owner: root
    group: root
    mode: '0644'
    backup: true
  notify: Reiniciar API

- name: Instalar validador seguro del fragmento Nginx
  ansible.builtin.copy:
    src: validate-nginx-fragment.sh
    dest: /usr/local/sbin/nexoeventos-validate-nginx
    owner: root
    group: root
    mode: '0755'

- name: Instalar configuración Nginx versionada
  ansible.builtin.template:
    src: nexoeventos-nginx.conf.j2
    dest: /etc/nginx/conf.d/nexoeventos.conf
    owner: root
    group: root
    mode: '0644'
    backup: true
    validate: /usr/local/sbin/nexoeventos-validate-nginx %s
  notify: Recargar Nginx

- name: Aplicar servicios y comprobar la nueva versión
  block:
    - name: Ejecutar handlers antes de la prueba
      ansible.builtin.meta: flush_handlers

    - name: Comprobar salud local de FastAPI
      ansible.builtin.uri:
        url: http://127.0.0.1:8000/ready
        status_code: 200
        return_content: false
      register: release_health
      retries: 10
      delay: 3
      until: release_health.status == 200
  rescue:
    - name: Restaurar enlace anterior cuando existe
      ansible.builtin.file:
        src: "{{ rollback_release }}"
        dest: "{{ nexoeventos_release_root }}/current"
        state: link
        force: true
      when: rollback_release | length > 0

    - name: Reiniciar API con la versión restaurada
      ansible.builtin.systemd_service:
        name: nexoeventos-api
        state: restarted
        daemon_reload: true

    - name: Informar reversión automática
      ansible.builtin.fail:
        msg: La comprobación de salud falló; se restauró current cuando había versión previa.
