# GENERADO por build_compose.py a partir de compose.tmpl.yml y parts/*. No editar compose.yml a mano.
# Laboratorio LOCAL de replicación lógica + failover de BD (Entregable 3). Sin nubes, sin costos, datos ficticios.
# Aislado: proyecto nexo-repl-lab, red 172.29.241.0/24, volúmenes y puertos propios (127.0.0.1).
name: nexo-repl-lab

x-pg: &pg
  image: postgres:18
  entrypoint: ["/bin/bash", "/lab-entry.sh"]   # arranque cerrado: ver parts/lab-entry.sh
  depends_on:
    witness: {condition: service_healthy}
  command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10",
            "-c", "max_logical_replication_workers=8", "-c", "max_connections=200", "-c", "wal_receiver_timeout=5s"]
  configs:
    - {source: db_init, target: /docker-entrypoint-initdb.d/10-roles.sql, mode: 0444}
    - {source: lab_entry, target: /lab-entry.sh, mode: 0444}
  environment:
    POSTGRES_PASSWORD: lab-local-only-admin
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres -d nexoeventos"]
    interval: 2s
    timeout: 2s
    retries: 30

x-app: &app
  image: nexo-repl-lab-backend:current   # código ACTUAL de backend/ sobre la imagen de desarrollo (ver Dockerfile.current); sin modificar el repositorio
  environment: &appenv
    APP_ENV: development
    DATABASE_URL: postgresql+psycopg://nexoeventos_app:lab-local-only-app@127.0.0.1:5432/nexoeventos
    FRONTEND_ORIGINS: http://127.0.0.1:18080,http://localhost:18080
    TICKET_ENCRYPTION_KEY: "${TICKET_ENCRYPTION_KEY:?Usa scripts/repl-lab/lab.sh up}"
  read_only: true
  tmpfs: [/tmp]
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]

services:
  pg-aws:
    <<: *pg
    environment: {POSTGRES_PASSWORD: lab-local-only-admin, NODE_NAME: pg-aws}
    ports: ["127.0.0.1:55441:5432"]
    volumes: ["pg-aws-data:/var/lib/postgresql"]

  pg-oci:
    <<: *pg
    environment: {POSTGRES_PASSWORD: lab-local-only-admin, NODE_NAME: pg-oci}
    ports: ["127.0.0.1:55442:5432"]
    volumes: ["pg-oci-data:/var/lib/postgresql"]

  witness:
    image: nexo-repl-lab-backend:current
    command: ["python", "/witness.py"]
    user: "0:0"
    cap_drop: ["ALL"]   # sin read_only: Compose no puede crear configs en línea en servicios de solo lectura
    configs:
      - {source: witness_py, target: /witness.py, mode: 0444}
    volumes: ["witness-data:/data"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/state', timeout=2)"]
      interval: 1s
      timeout: 3s
      retries: 30
    ports: ["127.0.0.1:18100:8000"]
    networks:
      default: {ipv4_address: 172.29.241.10}

  migrate:
    image: nexo-repl-lab-backend:current
    profiles: ["tools"]
    command: ["alembic", "upgrade", "head"]
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:lab-local-only-admin@pg-aws:5432/nexoeventos

  app-aws:
    <<: *app
    environment: {<<: *appenv, SITE_NAME: aws}
    ports: ["127.0.0.1:18001:8000", "127.0.0.1:18405:8405"]   # 8405 = estadísticas del gateway de BD de este nodo (sidecar)

  app-oci:
    <<: *app
    environment: {<<: *appenv, SITE_NAME: oci}
    ports: ["127.0.0.1:18002:8000", "127.0.0.1:18406:8405"]

  # Gateway de BD ("db-writer") como SIDECAR de cada app (comparte su red): la aplicación actual exige sslmode=verify-full para cualquier host de BD que no sea
  # local (backend/app/database.py), así que se conecta a 127.0.0.1:5432 y el sidecar reenvía al escritor que declara el witness.
  haproxy-db-aws:
    image: haproxy:lts-alpine
    network_mode: "service:app-aws"
    depends_on: [app-aws, witness]
    configs:
      - {source: haproxy_db_cfg, target: /usr/local/etc/haproxy/haproxy.cfg, mode: 0444}

  haproxy-db-oci:
    image: haproxy:lts-alpine
    network_mode: "service:app-oci"
    depends_on: [app-oci, witness]
    configs:
      - {source: haproxy_db_cfg, target: /usr/local/etc/haproxy/haproxy.cfg, mode: 0444}

  # Solo para la etapa E: la imagen ANTIGUA de desarrollo (22-oct) con su propio sidecar.
  app-stale:
    <<: *app
    image: nexoeventos-dev-backend:latest
    profiles: ["stale"]
    ports: ["127.0.0.1:18003:8000"]

  haproxy-db-stale:
    image: haproxy:lts-alpine
    profiles: ["stale"]
    network_mode: "service:app-stale"
    depends_on: [app-stale, witness]
    configs:
      - {source: haproxy_db_cfg, target: /usr/local/etc/haproxy/haproxy.cfg, mode: 0444}

  haproxy-edge:
    image: haproxy:lts-alpine
    configs:
      - {source: haproxy_edge_cfg, target: /usr/local/etc/haproxy/haproxy.cfg, mode: 0444}
    ports: ["127.0.0.1:18080:8080", "127.0.0.1:18404:8404"]

  cut-proxy:
    image: nexo-repl-lab-backend:current
    profiles: ["fault"]
    command: ["python", "/cutproxy.py"]
    cap_drop: ["ALL"]
    configs:
      - {source: cutproxy_py, target: /cutproxy.py, mode: 0444}
    ports: ["127.0.0.1:18090:8000", "127.0.0.1:18091:8001"]

networks:
  default:
    ipam:
      config: [{subnet: 172.29.241.0/24}]

configs:
  db_init:
    content: |
      CREATE ROLE nexoeventos_owner NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;
      CREATE ROLE nexoeventos_app LOGIN PASSWORD 'lab-local-only-app' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;
      CREATE ROLE repl LOGIN REPLICATION PASSWORD 'lab-local-only-repl' NOSUPERUSER NOCREATEDB NOCREATEROLE;
      CREATE DATABASE nexoeventos OWNER nexoeventos_owner;
      REVOKE ALL ON DATABASE nexoeventos FROM PUBLIC;
      GRANT CONNECT ON DATABASE nexoeventos TO nexoeventos_app, repl;
  lab_entry:
    content: |
      #!/bin/bash
      # Arranque CERRADO de PostgreSQL en el laboratorio: este nodo solo abre el acceso de red a la aplicación si el witness lo declara escritor
      # (o si el laboratorio aun no se inicializó: época 0). Si el witness no responde o declara a otro nodo, arranca con un pg_hba que RECHAZA todo acceso
      # por red (la administración local por socket sigue disponible). El estado vive en un archivo del volumen de datos, así que sobrevive a reinicios del contenedor.
      # (Los signos de dólar van duplicados por el escape de interpolación de Compose.)
      HBA=/var/lib/postgresql/lab-hba.conf
      mode=fenced; why="el witness no respondió (falla cerrada)"
      for try in 1 2 3 4; do
        body=$$( (exec 3<>/dev/tcp/172.29.241.10/8000 && printf 'GET /state HTTP/1.0\r\n\r\n' >&3 && timeout 3 cat <&3) 2>/dev/null )
        [ -n "$$body" ] && break
        sleep 1
      done
      if [ -n "$$body" ]; then
        if [[ "$$body" =~ \"epoch\":\ *0[,\}] ]]; then mode=open; why="laboratorio sin inicializar (época 0)"
        elif [[ "$$body" =~ \"writer\":\ *\"$$NODE_NAME\" ]]; then mode=open; why="el witness me declara escritor"
        else mode=fenced; why="el witness declara a otro nodo (o a ninguno) como escritor"; fi
      fi
      if [ "$$mode" = open ]; then
      cat > "$$HBA" <<'HBA_OPEN'
      local all all trust
      host all all 127.0.0.1/32 trust
      host all all ::1/128 trust
      host all all all scram-sha-256
      HBA_OPEN
      else
      cat > "$$HBA" <<'HBA_FENCED'
      local all all trust
      host all all all reject
      HBA_FENCED
      fi
      chown postgres:postgres "$$HBA"; chmod 600 "$$HBA"
      echo "[lab-entry] $$NODE_NAME arranca en modo $$mode: $$why" >&2
      exec docker-entrypoint.sh "$$@" -c "hba_file=$$HBA"

  witness_py:
    content: |
      """Witness del laboratorio: guarda quién es el escritor, su época y un lease con caducidad, y el ESTADO DE PROTECCIÓN de las reservas confirmadas (estado de protección con compare-and-set
      sobre su número de secuencia y su época). Estado persistente en /data.
      API de control (puerto 8000): GET /state · POST /set {writer, expect_epoch, ttl} (compare-and-set de escritor; invalida la protección: pasa a 'unknown') · POST /renew {node, epoch}
      · POST /prot {expect_seq, mode, primario, epoch} (compare-and-set del estado de protección; solo vale dentro de la época vigente) · POST /prot_verify {seq, primario, epoch}.
      Comprobaciones para HAProxy: puertos 8101 (pg-aws) y 8102 (pg-oci) → 200 solo si ese nodo es el escritor Y su lease no ha caducado."""
      import json, os, threading, time
      from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

      PATH, LOCK, TTL = "/data/state.json", threading.Lock(), 6.0
      NODES = {8101: "pg-aws", 8102: "pg-oci"}
      MODES = {"unknown", "unprotected", "protected", "degrading", "degraded", "reprotecting", "promoting"}


      def load():
          try:
              s = json.load(open(PATH))
          except Exception:
              s = {"writer": None, "epoch": 0, "expires": 0.0}
          s.setdefault("prot", {"mode": "unknown", "seq": 0, "primario": None, "epoch": s.get("epoch", 0), "verified": 0.0})
          return s


      def save(s):
          tmp = PATH + ".tmp"
          with open(tmp, "w") as f:
              json.dump(s, f); f.flush(); os.fsync(f.fileno())
          os.replace(tmp, PATH)


      def view(s):
          p = dict(s["prot"])
          v = p.pop("verified", 0.0)
          p["verified_age_s"] = round(time.time() - v, 2) if v else None
          return {"writer": s["writer"], "epoch": s["epoch"], "lease_remaining_s": round(max(0.0, s["expires"] - time.time()), 2), "prot": p}


      class H(BaseHTTPRequestHandler):
          def log_message(self, *a):
              pass

          def send(self, code, obj):
              b = json.dumps(obj).encode()
              self.send_response(code); self.send_header("Content-Type", "application/json"); self.send_header("Content-Length", str(len(b))); self.end_headers(); self.wfile.write(b)

          def do_GET(self):
              port = self.server.server_port
              with LOCK:
                  s = load()
              if port in NODES:
                  ok = s["writer"] == NODES[port] and time.time() < s["expires"]
                  return self.send(200 if ok else 503, {"writer": ok})
              self.send(200, view(s))

          def do_POST(self):
              body = json.loads(self.rfile.read(int(self.headers.get("Content-Length", 0))) or b"{}")
              with LOCK:
                  s = load()
                  if self.path == "/set":
                      if body.get("expect_epoch") != s["epoch"]:
                          return self.send(409, {"error": "época obsoleta", **view(s)})
                      old = s["prot"]
                      s = {"writer": body.get("writer"), "epoch": s["epoch"] + 1, "expires": time.time() + float(body.get("ttl", TTL)),
                           "prot": {"mode": "unknown", "seq": old["seq"] + 1, "primario": body.get("writer"), "epoch": s["epoch"] + 1, "verified": 0.0}}
                      save(s); return self.send(200, view(s))
                  if self.path == "/renew":
                      if s["writer"] != body.get("node") or s["epoch"] != body.get("epoch"):
                          return self.send(409, {"error": "no eres el escritor de esta época", **view(s)})
                      s["expires"] = time.time() + float(body.get("ttl", TTL)); save(s); return self.send(200, view(s))
                  if self.path == "/prot":
                      p = s["prot"]
                      if body.get("epoch") != s["epoch"]:
                          return self.send(409, {"error": "época obsoleta", **view(s)})
                      if body.get("expect_seq") != p["seq"]:
                          return self.send(409, {"error": "secuencia obsoleta (otro cambio de estado ganó)", **view(s)})
                      if body.get("mode") not in MODES:
                          return self.send(400, {"error": "modo desconocido"})
                      s["prot"] = {"mode": body["mode"], "seq": p["seq"] + 1, "primario": body.get("primario", p.get("primario")), "epoch": s["epoch"],
                                   "verified": time.time() if body["mode"] == "protected" else 0.0}
                      save(s); return self.send(200, view(s))
                  if self.path == "/prot_verify":
                      p = s["prot"]
                      if p["mode"] != "protected" or body.get("seq") != p["seq"] or body.get("epoch") != s["epoch"] or body.get("primario") != p.get("primario"):
                          return self.send(409, {"error": "el estado de protección cambió", **view(s)})
                      p["verified"] = time.time(); save(s); return self.send(200, view(s))
              self.send(404, {})


      for p in (8101, 8102):
          threading.Thread(target=ThreadingHTTPServer(("0.0.0.0", p), H).serve_forever, daemon=True).start()
      ThreadingHTTPServer(("0.0.0.0", 8000), H).serve_forever()

  cutproxy_py:
    content: |
      """Proxy de FALLA para el laboratorio: reenvía HTTP a app-aws y, si la petición trae `X-Lab-Drop-Response: 1`, RETIENE la respuesta (la app ya confirmó en la BD)
      hasta que el control la suelte: `drop` corta la conexión del cliente sin enviar nada. Control: GET :8001/held · POST :8001/release?mode=drop|forward."""
      import asyncio

      UP = ("app-aws", 8000)
      S = {"held": 0, "mode": None}
      REL = None


      async def read_http(r):
          head = await r.readuntil(b"\r\n\r\n")
          n = 0
          for line in head.split(b"\r\n"):
              if line.lower().startswith(b"content-length:"):
                  n = int(line.split(b":")[1])
          return head, (await r.readexactly(n) if n else b"")


      async def handle(cr, cw):
          global REL
          try:
              head, body = await read_http(cr)
              drop = b"x-lab-drop-response: 1" in head.lower()
              ur, uw = await asyncio.open_connection(*UP)
              uw.write(head + body); await uw.drain()
              rh, rb = await read_http(ur)
              uw.close()
              if drop:
                  REL = asyncio.Event(); S["held"] += 1; S["mode"] = None
                  await REL.wait()
                  if S["mode"] == "drop":
                      cw.transport.abort(); return
              cw.write(rh + rb); await cw.drain()
          except Exception:
              pass
          finally:
              try:
                  cw.close()
              except Exception:
                  pass


      async def control(cr, cw):
          global REL
          try:
              head, _ = await read_http(cr)
              line = head.split(b"\r\n")[0].decode()
              if "/release" in line:
                  S["mode"] = "drop" if "mode=drop" in line else "forward"
                  if REL: REL.set()
                  out = b'{"released":true}'
              else:
                  out = ('{"held":%d}' % S["held"]).encode()
              cw.write(b"HTTP/1.1 200 OK\r\nContent-Type: application/json\r\nContent-Length: %d\r\nConnection: close\r\n\r\n" % len(out) + out); await cw.drain()
          except Exception:
              pass
          finally:
              cw.close()


      async def main():
          a = await asyncio.start_server(handle, "0.0.0.0", 8000)
          b = await asyncio.start_server(control, "0.0.0.0", 8001)
          async with a, b:
              await asyncio.gather(a.serve_forever(), b.serve_forever())

      asyncio.run(main())

  haproxy_db_cfg:
    content: |
      # Punto de entrada estable de la BD ("db-writer"): TCP hacia el nodo que el witness declara escritor (lease vigente).
      # Sin escritor => sin servidor disponible => las conexiones fallan (falla segura, no dos escritores).
      global
          log stdout format raw local0
          maxconn 512
      defaults
          mode tcp
          log global
          timeout connect 1s
          timeout client 1h
          timeout server 1h
          retries 0
      resolvers docker
          nameserver dns 127.0.0.11:53
          hold valid 1s
      frontend pg
          bind 127.0.0.1:5432
          default_backend writer
      backend writer
          option httpchk
          http-check send meth GET uri /
          http-check expect status 200
          default-server inter 500ms fall 2 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr none
          server pg-aws pg-aws:5432 check addr 172.29.241.10 port 8101
          server pg-oci pg-oci:5432 check addr 172.29.241.10 port 8102
      frontend stats
          bind *:8405
          mode http
          stats enable
          stats uri /

  haproxy_edge_cfg:
    content: |
      # Entrada HTTP: aws principal, oci respaldo. Salud: /health (liveness, no toca la BD).
      global
          log stdout format raw local0
          maxconn 512
      defaults
          mode http
          log global
          option httplog
          timeout connect 1s
          timeout client 30s
          timeout server 30s
          retries 1
          option redispatch
      resolvers docker
          nameserver dns 127.0.0.11:53
          hold valid 1s
      frontend web
          bind *:8080
          default_backend apps
      backend apps
          http-response set-header X-Served-By %[srv_name]
          option httpchk
          http-check send meth GET uri /health
          http-check expect status 200
          default-server inter 1s fastinter 500ms downinter 1s fall 2 rise 3 on-marked-down shutdown-sessions resolvers docker init-addr none
          server aws app-aws:8000 check
          server oci app-oci:8000 check backup
      frontend stats
          bind *:8404
          stats enable
          stats uri /


volumes:
  pg-aws-data:
  pg-oci-data:
  witness-data:
