# Punto de entrada estable de la BD ("db-writer"): TCP hacia el nodo que el witness declara escritor (lease vigente).
# Sin escritor => sin servidor disponible => las conexiones fallan (falla segura, no dos escritores).
global
    log stdout format raw local0
    maxconn 512
defaults
    mode tcp
    log global
    timeout connect 1s
    timeout client 1h
    timeout server 1h
    retries 0
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 1s
frontend pg
    bind 127.0.0.1:5432
    default_backend writer
backend writer
    option httpchk
    http-check send meth GET uri /
    http-check expect status 200
    default-server inter 500ms fall 2 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr none
    server pg-aws pg-aws:5432 check addr 172.29.241.10 port 8101
    server pg-oci pg-oci:5432 check addr 172.29.241.10 port 8102
frontend stats
    bind *:8405
    mode http
    stats enable
    stats uri /
