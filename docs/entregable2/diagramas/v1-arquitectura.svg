<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Arquitectura Cloud V1 — NexoEventos (AWS us-east-1)</title>
<desc>Una EC2 pública con Nginx, React y FastAPI; RDS PostgreSQL privada Single-AZ; S3 privado; CloudWatch. Fuente: infra/aws (Terraform) y docs/arquitectura-inicial.md.</desc>
<rect width="1200" height="720" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="bold" fill="#1a1a1a">Figura 1. Arquitectura Cloud V1 — NexoEventos (AWS, us-east-1)</text>
<text x="24" y="56" fill="#555">Una sola instancia web y una base Single-AZ: dos puntos únicos de falla (SPOF). Sin balanceador, Auto Scaling ni Multi-AZ.</text>
<!-- Internet -->
<rect x="24" y="110" width="150" height="70" rx="10" fill="#eef3fb" stroke="#4a6fa5"/>
<text x="99" y="140" text-anchor="middle" font-weight="bold">Usuarios</text><text x="99" y="160" text-anchor="middle" fill="#555">HTTPS 443</text>
<rect x="24" y="220" width="150" height="62" rx="10" fill="#f6f6f6" stroke="#999"/>
<text x="99" y="246" text-anchor="middle">DuckDNS (A)</text><text x="99" y="266" text-anchor="middle" fill="#555">+ Let's Encrypt</text>
<!-- VPC -->
<rect x="215" y="86" width="945" height="600" rx="14" fill="#fbfdf8" stroke="#6a8f3c" stroke-width="2"/>
<text x="232" y="110" font-weight="bold" fill="#3d5a1e">VPC 10.20.0.0/16 (us-east-1) · Internet Gateway</text>
<!-- public subnet -->
<rect x="240" y="130" width="470" height="300" rx="10" fill="#fff8ec" stroke="#d99a2b"/>
<text x="256" y="154" font-weight="bold" fill="#8a5a00">Subred pública 10.20.1.0/24</text>
<rect x="262" y="176" width="426" height="130" rx="8" fill="#ffffff" stroke="#d99a2b"/>
<text x="475" y="200" text-anchor="middle" font-weight="bold">EC2 t3.small · Amazon Linux 2023</text>
<text x="475" y="222" text-anchor="middle" fill="#444">Nginx (80/443) → FastAPI (loopback) · React compilado</text>
<text x="475" y="242" text-anchor="middle" fill="#444">EBS gp3 20 GiB cifrado · IMDSv2 obligatorio</text>
<text x="475" y="262" text-anchor="middle" fill="#444">Perfil IAM: LabInstanceProfile (AWS Academy)</text>
<text x="475" y="288" text-anchor="middle" fill="#a33" font-weight="bold">SPOF 1 — instancia única</text>
<rect x="262" y="326" width="426" height="84" rx="8" fill="#fff" stroke="#c2873a" stroke-dasharray="5 4"/>
<text x="475" y="350" text-anchor="middle" font-weight="bold">Security Group web</text>
<text x="475" y="372" text-anchor="middle" fill="#444">Entrada: 80 y 443 desde 0.0.0.0/0 · SSH cerrado</text>
<text x="475" y="392" text-anchor="middle" fill="#444">Salida: 443 · DNS en la VPC · 5432 al SG de la base</text>
<!-- private subnets -->
<rect x="740" y="130" width="400" height="300" rx="10" fill="#eef6ff" stroke="#4a7fb5"/>
<text x="756" y="154" font-weight="bold" fill="#1f4c7a">Subredes privadas de datos</text>
<text x="756" y="174" fill="#444">10.20.21.0/24 y 10.20.22.0/24 (sin ruta a Internet)</text>
<rect x="762" y="196" width="356" height="130" rx="8" fill="#fff" stroke="#4a7fb5"/>
<text x="940" y="222" text-anchor="middle" font-weight="bold">RDS PostgreSQL db.t3.micro</text>
<text x="940" y="244" text-anchor="middle" fill="#444">Single-AZ · privada · gp2 20 GiB cifrada</text>
<text x="940" y="264" text-anchor="middle" fill="#444">Backups automáticos 7 días</text><text x="940" y="282" text-anchor="middle" fill="#444">Credencial maestra en Secrets Manager</text>
<text x="940" y="310" text-anchor="middle" fill="#a33" font-weight="bold">SPOF 2 — base Single-AZ</text>
<rect x="762" y="344" width="356" height="64" rx="8" fill="#fff" stroke="#4a7fb5" stroke-dasharray="5 4"/>
<text x="940" y="368" text-anchor="middle" font-weight="bold">Security Group base de datos</text>
<text x="940" y="390" text-anchor="middle" fill="#444">5432 solo desde el SG web (SG → SG)</text>
<!-- services -->
<rect x="240" y="470" width="900" height="190" rx="10" fill="#f6f2fb" stroke="#7a5aa5"/>
<text x="256" y="494" font-weight="bold" fill="#4a2f73">Servicios gestionados de AWS (acceso por HTTPS desde la EC2)</text>
<rect x="262" y="514" width="270" height="124" rx="8" fill="#fff" stroke="#7a5aa5"/>
<text x="397" y="540" text-anchor="middle" font-weight="bold">S3 privado</text>
<text x="397" y="562" text-anchor="middle" fill="#444">Bloqueo de acceso público</text>
<text x="397" y="582" text-anchor="middle" fill="#444">Versionado · SSE-S3 (AES-256)</text>
<text x="397" y="602" text-anchor="middle" fill="#444">Respaldos cifrados (CMS)</text>
<rect x="555" y="514" width="270" height="124" rx="8" fill="#fff" stroke="#7a5aa5"/>
<text x="690" y="540" text-anchor="middle" font-weight="bold">CloudWatch</text>
<text x="690" y="562" text-anchor="middle" fill="#444">Logs API y Nginx (7 días)</text>
<text x="690" y="582" text-anchor="middle" fill="#444">Alarma CPU &gt; 80 %</text>
<text x="690" y="602" text-anchor="middle" fill="#444">Agente CloudWatch en la EC2</text>
<rect x="848" y="514" width="270" height="124" rx="8" fill="#fff" stroke="#7a5aa5"/>
<text x="983" y="540" text-anchor="middle" font-weight="bold">Secrets Manager · SSM</text>
<text x="983" y="562" text-anchor="middle" fill="#444">Secreto maestro de RDS</text>
<text x="983" y="582" text-anchor="middle" fill="#444">Session Manager (sin SSH)</text>
<text x="983" y="602" text-anchor="middle" fill="#444">Snapshot manual cifrado</text>
<!-- arrows -->
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker></defs>
<path d="M174,145 L262,230" stroke="#333" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M174,251 L262,251" stroke="#999" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#a)"/>
<path d="M688,232 L762,232" stroke="#333" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="725" y="222" text-anchor="middle" fill="#333" font-size="12">5432</text>
<path d="M475,306 L475,330" stroke="#c2873a" stroke-width="1.5" fill="none"/>
<path d="M397,430 L397,514" stroke="#7a5aa5" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<path d="M600,430 L650,514" stroke="#7a5aa5" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="24" y="330" fill="#555" font-size="12">No hay NAT Gateway, balanceador,</text><text x="24" y="348" fill="#555" font-size="12">Auto Scaling, réplica ni Multi-AZ.</text>
<text x="24" y="380" fill="#555" font-size="12">Conservado como línea base de</text><text x="24" y="398" fill="#555" font-size="12">comparación para la V2.</text>
<text x="24" y="704" fill="#777" font-size="12">Fuente: infra/aws/*.tf, docs/arquitectura-inicial.md. Elaboración propia a partir de los recursos reales del estado Terraform.</text>
</svg>
