          description: 'OCI Monitoring, bucket de respaldos (descargas/verificaciones).'
          tags:
            - tag: source
              value: historical
        - uuid: 8d3bb8e84040415b90f461b9dd0c0472
          name: '[hist] Object Storage: PutRequests (5 min)'
          type: TRAP
