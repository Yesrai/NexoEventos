    - uuid: 526a6b9caff74eb4abeb3322c3ce40c7
      template: 'NexoEventos Historical Metrics'
      name: 'NexoEventos Historical Metrics (datos históricos reales importados)'
      description: |
        Series reales de AWS (CloudWatch) y OCI (Monitoring) y de las pruebas de carga, obtenidas de solo lectura en las ventanas en que los recursos estuvieron encendidos
        e importadas a Zabbix con su marca de tiempo original (history.push). NO son monitoreo en vivo: los paneles lo indican y la fecha de cada serie es la real.
      groups:
        - name: Templates/NexoEventos
      items:
        - uuid: 180b608d53204d548fc66c10fe60c0d8
          name: '[hist] Errores 5xx por intervalo (ALB)'
          type: TRAP
          key: nexo.hist.alb_5xx
          delay: '0'
          history: 365d
          value_type: FLOAT
          description: 'ALB HTTPCode_Target_5XX_Count (CloudWatch).'
          tags:
            - tag: source
              value: historical
        - uuid: 1c6608c692854eb3ba23c48870bc79cb
          name: '[hist] Peticiones por intervalo (ALB)'
          type: TRAP
          key: nexo.hist.alb_requests
          delay: '0'
          history: 365d
          value_type: FLOAT
          description: 'ALB RequestCount (CloudWatch).'
          tags:
            - tag: source
              value: historical
        - uuid: ee0f4be37e5f4b44b26a6ee333551bda
          name: '[hist] Latencia de destino ALB (s)'
          type: TRAP
          key: nexo.hist.alb_target_time
          delay: '0'
          history: 365d
          value_type: FLOAT
          units: s
          description: 'ALB TargetResponseTime (CloudWatch).'
          tags:
            - tag: source
              value: historical
        - uuid: 97294ad33080436fb0573041ec652808
          name: '[hist] Instancias en servicio (ASG)'
          type: TRAP
          key: nexo.hist.asg_in_service
          delay: '0'
