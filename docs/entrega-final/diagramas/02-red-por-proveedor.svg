<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, Helvetica, sans-serif" font-size="13">
<title>Red y conectividad por proveedor</title><desc>VPC AWS 10.20.0.0/16, VCN OCI 10.30.0.0/16, VNet Azure 10.40.0.0/16; sin VPN ni peering entre nubes; el único canal es HTTPS 443.</desc>
<rect width="1280" height="720" fill="#ffffff"/>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#c0392b"/></marker><marker id="ap" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4527a0"/></marker><marker id="ag" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2e7d32"/></marker></defs>
<text x="24" y="32" font-size="19" font-weight="bold" fill="#1a1a1a" text-anchor="start">Figura F2. Red y conectividad por proveedor (fuente: infra/aws, infra/aws-v2, infra/oci, infra/azure)</text>
<text x="24" y="54" font-size="12.5" fill="#555" text-anchor="start">No existe VPN, peering ni interconexión privada entre nubes: toda comunicación entre proveedores es HTTPS 443 con TLS verificado.</text>
<rect x="24" y="80" width="420" height="560" rx="12" fill="#fff8ec" stroke="#d99a2b" stroke-width="2"/>
<text x="234.0" y="100" font-size="15" font-weight="bold" fill="#8a5a00" text-anchor="middle">AWS · VPC 10.20.0.0/16 (us-east-1)</text>
<rect x="44" y="120" width="185" height="210" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
<text x="136.5" y="140" font-size="12" font-weight="bold" fill="#1b5e20" text-anchor="middle">pública-a 10.20.1.0/24</text>
<text x="136.5" y="158" font-size="12" fill="#333" text-anchor="middle">us-east-1a</text>
<text x="136.5" y="174" font-size="12" fill="#333" text-anchor="middle">ALB · EC2 V2</text>
<text x="136.5" y="190" font-size="12" fill="#333" text-anchor="middle">EC2 V1 (detenida)</text>
<rect x="239" y="120" width="185" height="210" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
<text x="331.5" y="140" font-size="12" font-weight="bold" fill="#1b5e20" text-anchor="middle">pública-b 10.20.2.0/24</text>
<text x="331.5" y="158" font-size="12" fill="#333" text-anchor="middle">us-east-1b</text>
<text x="331.5" y="174" font-size="12" fill="#333" text-anchor="middle">ALB · EC2 V2</text>
<text x="331.5" y="190" font-size="12" fill="#333" text-anchor="middle">(solo con V2)</text>
<rect x="44" y="345" width="185" height="100" rx="8" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.5"/>
<text x="136.5" y="365" font-size="12" font-weight="bold" fill="#424242" text-anchor="middle">datos-a 10.20.21.0/24</text>
<text x="136.5" y="383" font-size="12" fill="#333" text-anchor="middle">privada, sin ruta</text>
<text x="136.5" y="399" font-size="12" fill="#333" text-anchor="middle">a Internet · RDS</text>
<rect x="239" y="345" width="185" height="100" rx="8" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.5"/>
<text x="331.5" y="365" font-size="12" font-weight="bold" fill="#424242" text-anchor="middle">datos-b 10.20.22.0/24</text>
<text x="331.5" y="383" font-size="12" fill="#333" text-anchor="middle">privada, sin ruta</text>
<text x="331.5" y="399" font-size="12" fill="#333" text-anchor="middle">a Internet · RDS standby</text>
<rect x="44" y="460" width="380" height="165" rx="8" fill="#fff8ec" stroke="#d99a2b" stroke-width="1.5"/>
<text x="54" y="480" font-size="13" font-weight="bold" fill="#8a5a00" text-anchor="start">Reglas (SG→SG)</text>
<text x="54" y="498" font-size="12" fill="#333" text-anchor="start">SG ALB: 443 y 80 (→301) desde 0.0.0.0/0</text>
<text x="54" y="514" font-size="12" fill="#333" text-anchor="start">SG web: 80 solo desde SG del ALB; SSH cerrado (SSM)</text>
<text x="54" y="530" font-size="12" fill="#333" text-anchor="start">SG base: 5432 solo desde SG web</text>
<text x="54" y="546" font-size="12" fill="#333" text-anchor="start">Internet Gateway · sin NAT Gateway (costo)</text>
<text x="54" y="562" font-size="12" fill="#333" text-anchor="start">Riesgo: EC2 con IPv4 pública (Trivy)</text>
<rect x="464" y="80" width="380" height="560" rx="12" fill="#fdecec" stroke="#c0392b" stroke-width="2"/>
<text x="654.0" y="100" font-size="15" font-weight="bold" fill="#8a1f14" text-anchor="middle">OCI · VCN 10.30.0.0/16 (sa-saopaulo-1)</text>
<rect x="484" y="120" width="340" height="120" rx="8" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.5"/>
<text x="654.0" y="140" font-size="12" font-weight="bold" fill="#424242" text-anchor="middle">Subred privada 10.30.1.0/24</text>
<text x="654.0" y="158" font-size="12" fill="#333" text-anchor="middle">sin IP pública · NSG de recuperación</text>
<text x="654.0" y="174" font-size="12" fill="#333" text-anchor="middle">Service Gateway → Object Storage</text>
<text x="654.0" y="190" font-size="12" fill="#333" text-anchor="middle">NAT Gateway (salida)</text>
<rect x="484" y="255" width="340" height="120" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
<text x="654.0" y="275" font-size="12" font-weight="bold" fill="#1b5e20" text-anchor="middle">Subred pública 10.30.2.0/24 (temporal)</text>
<text x="654.0" y="293" font-size="12" fill="#333" text-anchor="middle">solo durante T3: IGW + entrada 443</text>
<text x="654.0" y="309" font-size="12" fill="#333" text-anchor="middle">CIDR permitidos explícitos (nunca 0.0.0.0/0)</text>
<text x="654.0" y="325" font-size="12" fill="#333" text-anchor="middle">22/80/5432/8000 NO alcanzables (medido)</text>
<rect x="484" y="390" width="340" height="90" rx="8" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.5"/>
<text x="654.0" y="410" font-size="12" font-weight="bold" fill="#424242" text-anchor="middle">Bastion OCI (temporal)</text>
<text x="654.0" y="428" font-size="12" fill="#333" text-anchor="middle">reenvío de puerto SSH/HTTPS</text>
<text x="654.0" y="444" font-size="12" fill="#333" text-anchor="middle">origen limitado al operador</text>
<rect x="484" y="495" width="340" height="130" rx="8" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/>
<text x="654.0" y="515" font-size="13" font-weight="bold" fill="#8a1f14" text-anchor="middle">Object Storage (servicio regional)</text>
<text x="654.0" y="533" font-size="12" fill="#333" text-anchor="middle">bucket privado, NoPublicAccess, versionado</text>
<text x="654.0" y="549" font-size="12" fill="#333" text-anchor="middle">PAR temporales (T1: 3 creados, 3 revocados → 401)</text>
<text x="654.0" y="565" font-size="12" fill="#333" text-anchor="middle">subidor sin borrar/sobrescribir</text>
<rect x="864" y="80" width="392" height="560" rx="12" fill="#eaf4ff" stroke="#2b6cb0" stroke-width="2"/>
<text x="1060.0" y="100" font-size="15" font-weight="bold" fill="#17406e" text-anchor="middle">Azure · VNet 10.40.0.0/16 (centralus)</text>
<rect x="884" y="120" width="352" height="140" rx="8" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.5"/>
<text x="1060.0" y="140" font-size="12" font-weight="bold" fill="#424242" text-anchor="middle">Subred 10.40.1.0/24</text>
<text x="1060.0" y="158" font-size="12" fill="#333" text-anchor="middle">VM de observabilidad (Zabbix, Grafana,</text>
<text x="1060.0" y="174" font-size="12" fill="#333" text-anchor="middle">recolector, testigo, centro de operaciones)</text>
<text x="1060.0" y="190" font-size="12" fill="#333" text-anchor="middle">IP pública estática · identidad administrada</text>
<rect x="884" y="275" width="352" height="160" rx="8" fill="#eaf4ff" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="1060.0" y="295" font-size="13" font-weight="bold" fill="#17406e" text-anchor="middle">NSG</text>
<text x="1060.0" y="313" font-size="12" fill="#333" text-anchor="middle">Entrada: 22 y 443 solo desde IP /32 del operador</text>
<text x="1060.0" y="329" font-size="12" fill="#333" text-anchor="middle">Entrada: resto DENEGADO</text>
<text x="1060.0" y="345" font-size="12" fill="#333" text-anchor="middle">Salida: 80/443, 123 UDP, 53 (DNS de Azure)</text>
<text x="1060.0" y="361" font-size="12" fill="#333" text-anchor="middle">UFW en la VM · Nginx TLS (huella fijada)</text>
<rect x="884" y="450" width="352" height="175" rx="8" fill="#eaf4ff" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="1060.0" y="470" font-size="13" font-weight="bold" fill="#17406e" text-anchor="middle">Servicios gestionados</text>
<text x="1060.0" y="488" font-size="12" fill="#333" text-anchor="middle">Azure Monitor + Log Analytics (30 días)</text>
<text x="1060.0" y="504" font-size="12" fill="#333" text-anchor="middle">alerta-nexo-sonda (métrica de la VM)</text>
<text x="1060.0" y="520" font-size="12" fill="#333" text-anchor="middle">Application Insights web test</text>
<text x="1060.0" y="536" font-size="12" fill="#333" text-anchor="middle">presupuesto + apagado automático 17:38 UTC</text>
<text x="560" y="290" font-size="10" fill="#222" text-anchor="start"></text>
<rect x="300" y="655" width="680" height="50" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
<text x="640" y="676" font-size="13" font-weight="bold" fill="#bf360c" text-anchor="middle">Canales entre nubes: HTTPS 443 (sondas Azure→AWS/OCI; respaldo AWS→OCI; lease vía PAR)</text>
<text x="640" y="695" font-size="12" fill="#bf360c" text-anchor="middle">Sin VPN / peering / FastConnect / ExpressRoute — decisión de costo y de independencia de fallos</text>
</svg>