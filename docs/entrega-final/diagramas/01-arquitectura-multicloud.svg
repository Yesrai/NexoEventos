<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 770" width="1280" height="770" font-family="Arial, Helvetica, sans-serif" font-size="13">
<title>Arquitectura multicloud final de NexoEventos</title><desc>AWS producción (dos puntos de operación), OCI recuperación y lease, Azure observabilidad y testigo, DuckDNS para el dominio de pruebas. Rótulos REAL/LOCAL/DISEÑO según la evidencia T1-T6.</desc>
